name: Migrate fork signing secrets

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Seal repository secrets or verify migrated environment secrets
        type: choice
        required: true
        default: seal
        options: [seal, verify]

permissions:
  contents: read

concurrency:
  group: migrate-fork-signing
  cancel-in-progress: false

jobs:
  seal:
    if: >-
      github.repository == 'alexander-cato/t3code' &&
      github.ref == 'refs/heads/main' && inputs.mode == 'seal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install distro encryption library
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-nacl

      - name: Seal signing secrets for fork-release
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -I - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          from nacl import encoding, public

          def seal():
              names = (
                  "CSC_LINK", "CSC_KEY_PASSWORD", "APPLE_API_KEY",
                  "APPLE_API_KEY_ID", "APPLE_API_ISSUER", "MACOS_PROVISIONING_PROFILE",
              )
              values = {name: os.environ.pop(name, None) for name in names}
              if any(value is None or value == "" for value in values.values()):
                  raise ValueError("Missing signing secret")
              key = public.PublicKey(
                  b"2ZjhInEk6a82eWhu88639Fav+72Q/Wkm8QEBaj1ERy4=", encoding.Base64Encoder(),
              )
              box = public.SealedBox(key)
              payload = {
                  "environment": "fork-release",
                  "key_id": "3380204578043523366",
                  "secrets": [
                      {
                          "name": name,
                          "encrypted_value": base64.b64encode(
                              box.encrypt(values[name].encode("utf-8")),
                          ).decode("ascii"),
                      }
                      for name in names
                  ],
              }
              directory = Path(os.environ["RUNNER_TEMP"]) / "fork-signing-migration"
              directory.mkdir(mode=0o700)
              destination = directory / "encrypted-secrets.json"
              descriptor = os.open(destination, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(descriptor, "w", encoding="utf-8") as output:
                  json.dump(payload, output, separators=(",", ":"))
                  output.write("\n")

          try:
              seal()
          except Exception:
              raise SystemExit("Signing secret sealing failed; no plaintext output is available.") from None
          PY

      - name: Upload encrypted migration payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fork-signing-encrypted
          path: ${{ runner.temp }}/fork-signing-migration/encrypted-secrets.json
          if-no-files-found: error
          retention-days: 1

  verify:
    if: >-
      github.repository == 'alexander-cato/t3code' &&
      github.ref == 'refs/heads/main' && inputs.mode == 'verify'
    runs-on: macos-26
    environment: fork-release
    timeout-minutes: 10
    steps:
      - name: Verify migrated signing credentials
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3 -I - <<'PY'
          import base64
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import plistlib
          import re
          import secrets
          import shutil
          import subprocess

          directory = Path(os.environ["RUNNER_TEMP"]) / "fork-signing-verify"
          keychain = directory / "signing.keychain-db"

          def run(arguments):
              result = subprocess.run(arguments, capture_output=True, timeout=120, check=False)
              if result.returncode != 0:
                  raise ValueError("Credential verification command failed")
              return result.stdout

          def verify():
              names = (
                  "CSC_LINK", "CSC_KEY_PASSWORD", "APPLE_API_KEY",
                  "APPLE_API_KEY_ID", "APPLE_API_ISSUER", "MACOS_PROVISIONING_PROFILE",
              )
              values = {name: os.environ.pop(name, None) for name in names}
              if any(value is None or value == "" for value in values.values()):
                  raise ValueError("Missing signing secret")
              directory.mkdir(mode=0o700)
              certificate = directory / "certificate.p12"
              api_key = directory / "apple-api-key.p8"
              profile = directory / "profile.provisionprofile"
              certificate.write_bytes(base64.b64decode("".join(values["CSC_LINK"].split()), validate=True))
              api_key.write_bytes(values["APPLE_API_KEY"].encode("utf-8"))
              profile.write_bytes(base64.b64decode("".join(values["MACOS_PROVISIONING_PROFILE"].split()), validate=True))
              for credential in (certificate, api_key, profile):
                  credential.chmod(0o600)
              password = secrets.token_urlsafe(32)
              run(["/usr/bin/security", "create-keychain", "-p", password, str(keychain)])
              run(["/usr/bin/security", "set-keychain-settings", "-lut", "3600", str(keychain)])
              run(["/usr/bin/security", "unlock-keychain", "-p", password, str(keychain)])
              run([
                  "/usr/bin/security", "import", str(certificate), "-k", str(keychain),
                  "-P", values["CSC_KEY_PASSWORD"], "-T", "/usr/bin/codesign",
              ])
              fingerprint = "6AAA8F287E3D81784996631073033D7A6051C12A"
              team = "5Y33T3HS8S"
              identities = run([
                  "/usr/bin/security", "find-identity", "-v", "-p", "codesigning", str(keychain),
              ]).decode("utf-8")
              identity = rf'^\s*\d+\)\s+{fingerprint}\s+"Developer ID Application: [^"\n]+\({team}\)"\s*$'
              if not re.search(identity, identities, re.MULTILINE):
                  raise ValueError("Unexpected Developer ID identity")
              history = json.loads(run([
                  "/usr/bin/xcrun", "notarytool", "history", "--key", str(api_key),
                  "--key-id", values["APPLE_API_KEY_ID"], "--issuer", values["APPLE_API_ISSUER"],
                  "--output-format", "json",
              ]))
              if not isinstance(history.get("history"), list):
                  raise ValueError("Invalid notarization authentication response")
              document = plistlib.loads(run(["/usr/bin/security", "cms", "-D", "-i", str(profile)]))
              expiry = document["ExpirationDate"].replace(tzinfo=datetime.timezone.utc)
              entitlements = document["Entitlements"]
              application = entitlements.get("com.apple.application-identifier", entitlements.get("application-identifier"))
              if (
                  expiry <= datetime.datetime.now(datetime.timezone.utc)
                  or team not in document["TeamIdentifier"]
                  or application != f"{team}.com.alexandercato.t3code.fork"
                  or not any(
                      hashlib.sha1(item).hexdigest().upper() == fingerprint
                      for item in document["DeveloperCertificates"]
                  )
              ):
                  raise ValueError("Invalid fork provisioning profile")

          try:
              verify()
          except Exception:
              raise SystemExit("Signing credential verification failed; details were withheld.") from None
          finally:
              try:
                  subprocess.run(
                      ["/usr/bin/security", "delete-keychain", str(keychain)],
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=30, check=False,
                  )
              except (OSError, subprocess.SubprocessError):
                  pass
              finally:
                  shutil.rmtree(directory, ignore_errors=True)
          PY

      - name: Remove verification credentials
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/fork-signing-verify/signing.keychain-db" >/dev/null 2>&1 || true
          rm -rf -- "$RUNNER_TEMP/fork-signing-verify"
